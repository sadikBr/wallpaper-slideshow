name: Release

# Runs when a v* tag is pushed, or manually from the Actions tab with a version
# (e.g. v1.0.0), in which case the tag is created on the selected commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3, got: $TAG"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK and release notes
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "WallpaperSlideshow-${TAG}.apk"
          # Take this version's section from CHANGELOG.md (everything up to the next "## [").
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release ${TAG}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Wallpaper Slideshow ${{ env.TAG }}
          body_path: release-notes.md
          files: WallpaperSlideshow-${{ env.TAG }}.apk
