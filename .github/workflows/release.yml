name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "VideoSlideshow-${GITHUB_REF_NAME}.apk"
          # Take this version's section from CHANGELOG.md (everything up to the next "## [").
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release ${GITHUB_REF_NAME}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Video Slideshow ${{ github.ref_name }}
          body_path: release-notes.md
          files: VideoSlideshow-${{ github.ref_name }}.apk
